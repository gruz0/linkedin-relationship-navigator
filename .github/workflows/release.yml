name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and deploy (for example, v0.2.0)'
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release-context:
    name: Prepare release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.select.outputs.release_created }}
      tag_name: ${{ steps.select.outputs.tag_name }}
      release_ref: ${{ steps.select.outputs.release_ref }}
    steps:
      - name: Create or update release PR
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Select release
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          AUTOMATED_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          AUTOMATED_TAG: ${{ steps.release.outputs.tag_name }}
          AUTOMATED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$MANUAL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must use the vMAJOR.MINOR.PATCH form" >&2
              exit 1
            fi

            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
            echo "release_ref=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$AUTOMATED_RELEASE_CREATED" == "true" ]]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$AUTOMATED_TAG" >> "$GITHUB_OUTPUT"
            echo "release_ref=$AUTOMATED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  build-pages:
    name: Build Pages release
    needs: release-context
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-context.outputs.release_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build application
        run: bun run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Deploy Pages release
    needs: [release-context, build-pages]
    if: needs.release-context.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
